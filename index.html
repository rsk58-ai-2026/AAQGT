<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>アトラクション運営</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 0. 端末役割 選択画面 -->
  <div id="role-select-screen" class="screen-container hidden">
    <div class="card select-card">
      <h1 class="title">端末役割</h1>
      <div class="role-button-group">
        <button class="btn btn-role" onclick="AdminApp.selectRole('entry')"><span class="role-icon">🎛️</span> 入口 / 管理</button>
        <button class="btn btn-role" onclick="AdminApp.selectRole('room1')"><span class="role-icon">1️⃣</span> 第1問</button>
        <button class="btn btn-role" onclick="AdminApp.selectRole('room2')"><span class="role-icon">2️⃣</span> 第2問</button>
        <button class="btn btn-role" onclick="AdminApp.selectRole('room3')"><span class="role-icon">3️⃣</span> 第3問</button>
        <button class="btn btn-role" onclick="AdminApp.selectRole('exit')"><span class="role-icon">🏁</span> 出口 / リザルト</button>
      </div>
    </div>
  </div>

  <!-- 1. 入口 / 運営管理画面 -->
  <div id="admin-screen" class="screen-container hidden">
    <header class="app-header">
      <div class="header-left">
        <span id="sync-dot" class="sync-dot"></span>
        <span id="sync-text" class="sync-text">--:--:--</span>
        <span class="badge badge-admin">入口 / 管理</span>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="AdminApp.resetDeviceRole()">⚙️ 役割変更</button>
    </header>

    <main class="admin-main">
      <section class="section-card">
        <h2 class="section-title">ブース状況</h2>
        <div class="pipeline-grid">
          <div id="card-room1" class="room-card status-unknown">
            <div class="room-header">
              <span class="room-name">第1問</span>
              <span id="battery-room1" class="battery-alert hidden">🪫充電少</span>
              <span id="lamp-room1" class="status-lamp"></span>
            </div>
            <div class="room-body">
              <div class="group-badge" id="group-room1">--</div>
              <div class="status-label" id="status-label-room1">--</div>
            </div>
          </div>
          <div id="card-room2" class="room-card status-unknown">
            <div class="room-header">
              <span class="room-name">第2問</span>
              <span id="battery-room2" class="battery-alert hidden">🪫充電少</span>
              <span id="lamp-room2" class="status-lamp"></span>
            </div>
            <div class="room-body">
              <div class="group-badge" id="group-room2">--</div>
              <div class="status-label" id="status-label-room2">--</div>
            </div>
          </div>
          <div id="card-room3" class="room-card status-unknown">
            <div class="room-header">
              <span class="room-name">第3問</span>
              <span id="battery-room3" class="battery-alert hidden">🪫充電少</span>
              <span id="lamp-room3" class="status-lamp"></span>
            </div>
            <div class="room-body">
              <div class="group-badge" id="group-room3">--</div>
              <div class="status-label" id="status-label-room3">--</div>
            </div>
          </div>
          <div id="card-exit" class="room-card status-unknown">
            <div class="room-header">
              <span class="room-name">出口</span>
              <span id="battery-exit" class="battery-alert hidden">🪫充電少</span>
              <span id="lamp-exit" class="status-lamp"></span>
            </div>
            <div class="room-body">
              <div class="group-badge" id="group-exit">--</div>
              <div class="status-label" id="status-label-exit">--</div>
            </div>
          </div>
        </div>
      </section>

      <section class="section-card control-card">
        <h2 class="section-title">進行操作</h2>
        <div class="control-grid">
          <div class="control-inputs">
            <div class="form-group">
              <label class="form-label">次グループID</label>
              <input type="text" id="next-group-id" class="form-input" value="G-01">
            </div>
            <div class="form-group">
              <label class="form-label">制限時間 (秒)</label>
              <input type="number" id="custom-time-limit" class="form-input" value="180" min="10" step="10">
            </div>
            <div class="form-group">
              <label class="form-label">難易度</label>
              <div class="diff-selector">
                <label><input type="radio" name="admin-diff" value="easy"> かんたん</label>
                <label><input type="radio" name="admin-diff" value="normal" checked> ふつう</label>
                <label><input type="radio" name="admin-diff" value="hard"> むずかしい</label>
                <label><input type="radio" name="admin-diff" value="ex"> 🔥 EX</label>
              </div>
            </div>
          </div>
          <div class="control-action">
            <div id="advance-warning" class="advance-warning">⚠️ 進行中ブースあり</div>
            <button id="btn-advance" class="btn btn-advance" disabled onclick="AdminApp.triggerAdvance()">
              ➡️ 全ブースを一斉進行
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 2. 問題機ブース画面 -->
  <div id="quiz-screen" class="screen-container hidden">
    <header class="quiz-header">
      <div class="quiz-header-info">
        <span id="quiz-room-badge" class="badge badge-quiz">第1問</span>
        <span id="quiz-group-badge" class="group-pill">--</span>
        <span id="quiz-ex-badge" class="badge badge-ex hidden">🔥 EX</span>
      </div>
      <div class="header-right-actions">
        <button id="btn-battery-quiz" class="btn btn-warning btn-sm" onclick="QuizApp.toggleBatteryAlert()">🔋 充電低下報告</button>
        <button class="btn btn-outline-danger btn-sm" onclick="AdminApp.resetDeviceRole()">⚙️ 役割</button>
      </div>
    </header>

    <!-- 待機画面 -->
    <div id="quiz-view-waiting" class="quiz-view">
      <div class="card waiting-card">
        <div class="waiting-icon-pulse">⏳</div>
        <h2 class="waiting-title">待機中</h2>
      </div>
    </div>

    <!-- 先に進んでください画面 (ピクトグラム & 矢印) -->
    <div id="quiz-view-move" class="quiz-view hidden">
      <div class="card move-card text-center">
        <div class="move-icon">🚶‍♂️ ➡️</div>
        <h1 class="move-text">次のブースへ<br>お進みください</h1>
        <div class="move-arrow-anim">⬇️</div>
      </div>
    </div>

    <!-- 問題プレイ画面 -->
    <div id="quiz-view-play" class="quiz-view hidden">
      <div class="quiz-top-bar">
        <div class="difficulty-tag" id="current-diff-tag">NORMAL</div>
        <div class="timer-container" id="timer-box">
          <span id="quiz-timer" class="timer-text">03:00</span>
        </div>
      </div>
      <div class="card question-card">
        <div class="question-header">
          <span class="question-id-badge" id="quiz-q-id">Q1-01</span>
        </div>
        <p class="question-text" id="quiz-question-text"></p>
        <!-- 画像 / 動画 プレースホルダー -->
        <div id="quiz-media-container" class="question-media-container hidden"></div>
      </div>
      <div class="hint-section">
        <div class="hint-header">
          <h3 class="hint-heading">💡 ヒント</h3>
          <button id="btn-next-hint" class="btn btn-secondary btn-sm" onclick="QuizApp.revealNextHint()">
            ヒント開示
          </button>
        </div>
        <div id="hint-list" class="hint-list"></div>
      </div>
      <div class="staff-action-bar">
        <button class="btn btn-danger btn-judge" onclick="QuizApp.openJudgeModal(false)">❌ 不正解</button>
        <button class="btn btn-success btn-judge" onclick="QuizApp.openJudgeModal(true)">⭕ 正解</button>
      </div>
    </div>

    <!-- 判定確認モーダル -->
    <div id="judge-modal" class="modal-overlay hidden">
      <div class="card modal-card">
        <h3 id="judge-modal-title" class="modal-title">判定確認</h3>
        <p class="modal-subtitle">解答：<strong id="modal-correct-answer">--</strong></p>
        <p class="modal-info">残り時間: <span id="modal-time-left">--</span> 秒</p>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="QuizApp.closeJudgeModal()">戻る</button>
          <button id="btn-confirm-judge" class="btn btn-primary" onclick="QuizApp.confirmAnswer()">送信</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 出口 / リザルト画面 -->
  <div id="result-screen" class="screen-container hidden">
    <header class="result-header">
      <div class="quiz-header-info">
        <span class="badge badge-exit">出口</span>
        <span class="group-pill"><strong id="result-group-id">--</strong></span>
      </div>
      <div class="header-right-actions">
        <button id="btn-battery-result" class="btn btn-warning btn-sm" onclick="ResultApp.toggleBatteryAlert()">🔋 充電低下報告</button>
        <button class="btn btn-outline-danger btn-sm" onclick="AdminApp.resetDeviceRole()">⚙️ 役割</button>
      </div>
    </header>

    <div id="result-view-waiting" class="quiz-view">
      <div class="card waiting-card">
        <div class="waiting-icon-pulse">🏁</div>
        <h2 class="waiting-title">待機中</h2>
      </div>
    </div>

    <div id="result-view-loading" class="quiz-view hidden">
      <div class="card waiting-card">
        <div class="waiting-icon-pulse">📊</div>
        <h2 class="waiting-title">集計中...</h2>
      </div>
    </div>

    <div id="result-view-content" class="quiz-view hidden">
      <div id="result-ex-banner" class="banner-ex-qualified hidden">
        <h2 class="ex-banner-title">🎉 EX挑戦権 獲得！</h2>
        <div class="ex-secret-box">
          <span class="secret-label">合言葉：</span>
          <strong class="secret-word" id="ex-secret-word">------</strong>
        </div>
      </div>

      <div id="result-normal-banner" class="banner-normal-clear">
        <h2 class="normal-banner-title">🎉 CLEAR</h2>
      </div>

      <div id="result-cards-container" class="result-cards-grid"></div>

      <button id="btn-finish-result" class="btn btn-success btn-finish-result" onclick="ResultApp.finishAndReady()">
        ✅ 案内完了（待機）
      </button>
    </div>
  </div>

  <!-- スクリプト -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
